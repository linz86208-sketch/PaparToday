<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="PaperToday 生物医学与 AI 论文阅读"><title>PaperToday · 生物医学与 AI 论文</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#667085;--line:#e7eaf0;--blue:#1769bc}*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;color:var(--ink);background:#f4f6f9;font-family:"Microsoft YaHei",system-ui,sans-serif}.topbar{position:sticky;top:0;z-index:10;height:64px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;gap:20px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{font-size:22px;font-weight:800;color:var(--blue)}.progress{flex:1;max-width:460px;height:4px;overflow:hidden;border-radius:10px;background:#e6ebf2}.progress span{display:block;width:0;height:100%;background:var(--blue)}.status{color:var(--muted);font-size:13px;white-space:nowrap}main{width:min(900px,92vw);margin:44px auto 180px}article{min-height:calc(100vh - 108px);padding:clamp(28px,6vw,72px);padding-bottom:96px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 60px rgba(22,34,51,.06)}.eyebrow{color:var(--blue);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{margin:18px 0 14px;font-size:clamp(29px,5vw,52px);line-height:1.28;letter-spacing:-.02em}.original-title{margin:0 0 26px;color:var(--muted);font-family:Georgia,serif;font-size:17px;line-height:1.65}.meta{padding:18px 0 30px;color:#596579;line-height:1.8;border-bottom:1px solid var(--line)}section{margin-top:52px}h2{margin:0 0 18px;font-size:22px}p{margin:0 0 18px;font-size:17px;line-height:2;white-space:pre-line}.source{color:#465369;font-family:Georgia,serif}.notice{padding:18px 20px;color:var(--muted);background:#f7f9fc;border-radius:10px}.paper-link{display:inline-flex;margin-top:42px;padding:13px 20px;color:#fff;background:var(--blue);border-radius:9px;text-decoration:none}.controls{position:fixed;right:22px;bottom:22px;z-index:20;display:flex;gap:8px;padding:8px;background:rgba(244,246,249,.94);border:1px solid rgba(231,234,240,.92);border-radius:14px;box-shadow:0 10px 30px rgba(22,34,51,.1);backdrop-filter:blur(10px)}button{padding:10px 14px;color:#344054;background:#fff;border:1px solid #d6dce5;border-radius:9px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.07)}.loading{padding:22vh 0;text-align:center;color:var(--muted)}@media(max-width:640px){.status{display:none}main{margin-top:18px}article{padding:26px 22px;padding-bottom:96px;border-radius:14px}section{margin-top:38px}.controls{right:12px;bottom:12px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">PaperToday</div><div class="progress" aria-label="当前论文阅读进度"><span id="progress-bar"></span></div><div class="status" id="cycle-status">正在载入论文…</div></header>
  <main><article id="paper"><div class="loading">正在获取今天的论文…</div></article></main>
  <div class="controls"><button id="toggle" type="button">暂停滚动</button><button id="next" type="button">下一篇</button></div>
  <script>
    "use strict";
    // 每篇论文完整播放周期为 2 小时；需要调整时只改这个数值。
    const ARTICLE_DURATION_MS=6*60*1000;
    let papers=[],paperIndex=0,playing=true,animationId=null,cycleStartedAt=0,elapsedBeforeStart=0;
    const paperElement=document.getElementById("paper"),statusElement=document.getElementById("cycle-status"),progressBar=document.getElementById("progress-bar"),toggleButton=document.getElementById("toggle");
    function escapeHTML(value){const node=document.createElement("div");node.textContent=String(value??"");return node.innerHTML}
    function safeURL(value){try{const url=new URL(value);return["http:","https:"].includes(url.protocol)?url.href:""}catch{return""}}
    function paragraphs(value){return escapeHTML(value||"暂无内容").replace(/\n{2,}/g,"</p><p>")}
    async function loadPapers(){try{const response=await fetch("/api/papers?journal=all");if(!response.ok)throw new Error("论文数据获取失败");const data=await response.json();papers=Array.isArray(data.papers)?data.papers:[];if(!papers.length)throw new Error("暂时没有可展示的论文");await showPaper(0)}catch(error){paperElement.innerHTML=`<div class="loading">${escapeHTML(error.message)}，请稍后刷新。</div>`;statusElement.textContent="载入失败"}}
    async function showPaper(index){
      cancelAnimationFrame(animationId);paperIndex=((index%papers.length)+papers.length)%papers.length;const paper=papers[paperIndex];window.scrollTo(0,0);progressBar.style.width="0";statusElement.textContent=`第 ${paperIndex+1} / ${papers.length} 篇 · 正在生成翻译与总结…`;paperElement.innerHTML='<div class="loading">正在准备这篇论文的翻译与总结…</div>';
      let enriched,aiUnavailable=false;
      try{const response=await fetch("/api/enrich",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(paper)});if(!response.ok)throw new Error("AI 内容暂不可用");enriched=await response.json()}
      catch{aiUnavailable=true;enriched={title_zh:paper.title,abstract_zh:"",summary_zh:""}}
      const link=safeURL(paper.url),summary=(enriched.summary_zh||"").trim(),abstractZh=(enriched.abstract_zh||"").trim(),sourceAbstract=(paper.abstract||"").trim();
      const summarySection=summary?`<section><h2>论文导读与总结</h2><p>${paragraphs(summary)}</p></section>`:"";
      const abstractZhSection=abstractZh?`<section><h2>中文摘要</h2><p>${paragraphs(abstractZh)}</p></section>`:"";
      const sourceSection=sourceAbstract?`<section><h2>英文摘要原文</h2><p class="source">${paragraphs(sourceAbstract)}</p></section>`:`<section><h2>论文摘要</h2><div class="notice">公开元数据中暂未提供这篇论文的摘要，可通过下方链接访问原文。</div></section>`;
      const aiNotice=aiUnavailable?`<div class="notice">AI 翻译与总结暂时不可用，以下保留论文原始信息与英文摘要。</div>`:"";
      paperElement.innerHTML=`<div class="eyebrow">${escapeHTML(paper.journal)} · ${escapeHTML(paper.date)}</div><h1>${escapeHTML(enriched.title_zh)}</h1><div class="original-title">${escapeHTML(paper.title)}</div><div class="meta">作者：${escapeHTML(paper.authors)}</div>${summarySection}${abstractZhSection}${sourceSection}${aiNotice}<div class="notice">翻译与总结由 AI 根据公开论文元数据生成，仅供阅读参考，请以论文原文为准。</div>${link?`<a class="paper-link" href="${escapeHTML(link)}" target="_blank" rel="noopener noreferrer">访问论文原文 →</a>`:""}`;startCycle()
    }
    function startCycle(){elapsedBeforeStart=0;cycleStartedAt=performance.now();playing=true;toggleButton.textContent="暂停滚动";tick(cycleStartedAt)}
    function tick(now){if(!playing)return;const elapsed=elapsedBeforeStart+now-cycleStartedAt,ratio=Math.min(elapsed/ARTICLE_DURATION_MS,1),maxScroll=Math.max(document.documentElement.scrollHeight-innerHeight,0);window.scrollTo(0,maxScroll*ratio);progressBar.style.width=`${ratio*100}%`;const remainingMinutes=Math.max(0,Math.ceil((ARTICLE_DURATION_MS-elapsed)/60000));statusElement.textContent=`第 ${paperIndex+1} / ${papers.length} 篇 · 约 ${remainingMinutes} 分钟后切换`;if(ratio>=1)showPaper(paperIndex+1);else animationId=requestAnimationFrame(tick)}
    toggleButton.addEventListener("click",()=>{if(playing){elapsedBeforeStart+=performance.now()-cycleStartedAt;playing=false;cancelAnimationFrame(animationId);toggleButton.textContent="继续滚动";statusElement.textContent=`第 ${paperIndex+1} / ${papers.length} 篇 · 已暂停`}else{playing=true;cycleStartedAt=performance.now();toggleButton.textContent="暂停滚动";animationId=requestAnimationFrame(tick)}});
    document.getElementById("next").addEventListener("click",()=>showPaper(paperIndex+1));loadPapers();
  </script>
</body>
</html>
