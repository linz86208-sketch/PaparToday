
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperToday - 全球学术前沿</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f5f7fb;
            color: #253044;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* 顶部导航 */
        header {
            background: white;
            border-bottom: 1px solid #e8edf5;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            height: 72px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            color: #1769bc;
            white-space: nowrap;
        }

        .logo span {
            color: #20334c;
        }

        .search-box {
            display: flex;
            flex: 1;
            max-width: 430px;
        }

        .search-box input {
            width: 100%;
            border: 1px solid #dce4ef;
            border-radius: 8px 0 0 8px;
            padding: 12px;
            outline: none;
        }

        button {
            cursor: pointer;
        }

        .search-box button {
            border: none;
            background: #1769bc;
            color: white;
            padding: 0 20px;
            border-radius: 0 8px 8px 0;
        }

        .header-label {
            color: #66758d;
            font-size: 14px;
        }

        /* 主体 */
        .container {
            max-width: 1200px;
            margin: 28px auto;
            padding: 0 20px;
        }

        /* 轮播公告 */
        .banner {
            background: linear-gradient(120deg, #123f70, #2278bf);
            color: white;
            padding: 32px;
            border-radius: 14px;
            margin-bottom: 26px;
            min-height: 170px;
        }

        .banner-tag {
            font-size: 13px;
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        #banner-title {
            font-size: 24px;
            margin: 18px 0 10px;
            line-height: 1.5;
        }

        #banner-title a:hover {
            text-decoration: underline;
        }

        #banner-desc {
            font-size: 13px;
            color: #dbe9ff;
        }

        /* 三栏布局 */
        .layout {
            display: grid;
            grid-template-columns: 190px minmax(0, 1fr) 220px;
            gap: 22px;
            align-items: start;
        }

        .panel {
            background: white;
            border: 1px solid #e9eef5;
            border-radius: 12px;
            padding: 20px;
        }

        .sidebar h3 {
            margin: 0 0 20px;
            font-size: 17px;
        }

        .category {
            display: block;
            width: 100%;
            border: none;
            background: transparent;
            color: #52617a;
            text-align: left;
            padding: 13px 12px;
            margin: 3px 0;
            border-radius: 8px;
            font-size: 15px;
        }

        .category:hover,
        .category.active {
            background: #eaf3ff;
            color: #1769bc;
            font-weight: bold;
        }

        .feed-title {
            font-size: 20px;
            font-weight: bold;
            padding-bottom: 17px;
            border-bottom: 1px solid #edf0f5;
        }

        .paper {
            padding: 24px 0;
            border-bottom: 1px solid #edf0f5;
        }

        .paper:last-child {
            border-bottom: none;
        }

        .journal-tag {
            display: inline-block;
            background: #eef5ff;
            color: #1969b8;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .paper h3 {
            font-size: 18px;
            line-height: 1.65;
            margin: 12px 0;
            overflow-wrap: anywhere;
        }

        .paper h3 a:hover {
            color: #1769bc;
        }

        .paper-info {
            font-size: 13px;
            color: #8290a4;
            line-height: 1.9;
        }

        .paper-link {
            display: inline-block;
            margin-top: 13px;
            font-size: 13px;
            color: #1769bc;
        }

        .right-panel h3 {
            font-size: 17px;
            margin-top: 0;
        }

        .right-panel p {
            font-size: 14px;
            color: #66758d;
            line-height: 1.9;
        }

        .loading {
            text-align: center;
            padding: 50px 10px;
            color: #8492a7;
        }

        .status {
            margin-top: 10px;
            color: #8090a6;
            font-size: 12px;
        }

        /* 手机与窄屏适配 */
        @media (max-width: 950px) {
            .layout {
                grid-template-columns: 175px minmax(0, 1fr);
            }

            .right-panel {
                display: none;
            }
        }

        @media (max-width: 650px) {
            .layout {
                display: block;
            }

            .sidebar {
                display: flex;
                overflow-x: auto;
                margin-bottom: 16px;
                gap: 8px;
            }

            .sidebar h3 {
                display: none;
            }

            .category {
                white-space: nowrap;
                width: auto;
            }

            .header-label {
                display: none;
            }

            .logo {
                font-size: 20px;
            }

            .banner {
                padding: 22px;
            }

            #banner-title {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">Paper<span>Today</span></div>

        <div class="search-box">
            <input
                id="search-input"
                type="text"
                placeholder="搜索当前列表中的论文标题..."
            >
            <button id="search-button">搜索</button>
        </div>

        <div class="header-label">全球科研资讯聚合平台</div>
    </div>
</header>

<div class="container">

    <!-- 顶部论文轮播 -->
    <section class="banner">
        <span class="banner-tag">学术前沿 · 最新动态</span>
        <h2 id="banner-title">正在获取全球最新科研论文...</h2>
        <div id="banner-desc">Nature · Science · Cell</div>
    </section>

    <div class="layout">

        <!-- 左侧分类 -->
        <aside class="panel sidebar">
            <h3>学术导航</h3>

            <button class="category active" data-journal="all">
                全部论文
            </button>

            <button class="category" data-journal="nature">
                Nature
            </button>

            <button class="category" data-journal="science">
                Science
            </button>

            <button class="category" data-journal="cell">
                Cell
            </button>
        </aside>

        <!-- 中间论文信息流 -->
        <main class="panel">
            <div class="feed-title">最新论文</div>
            <div class="status" id="status">正在连接学术数据库...</div>

            <div id="paper-list">
                <div class="loading">正在加载论文，请稍候...</div>
            </div>
        </main>

        <!-- 右侧 -->
        <aside class="panel right-panel">
            <h3>关于 PaperToday</h3>

            <p>
                汇聚全球前沿学术成果，
                追踪科研最新进展。
            </p>

            <h3>当前数据来源</h3>

            <p>Nature</p>
            <p>Science</p>
            <p>Cell</p>

            <h3>数据说明</h3>

            <p>
                论文元数据由 Crossref API 提供。
                点击论文标题可访问原文页面。
            </p>
        </aside>

    </div>
</div>

<script>
    let papers = [];
    let bannerIndex = 0;
    let currentJournal = "all";

    const listElement = document.getElementById("paper-list");
    const statusElement = document.getElementById("status");
    const searchInput = document.getElementById("search-input");

    // 转义文本，避免将论文标题当成 HTML 执行
    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char]));
    }

    // 仅允许 HTTPS 链接
    function safeURL(value) {
        try {
            const url = new URL(value);
            return url.protocol === "https:" ? url.href : "";
        } catch {
            return "";
        }
    }

    // 获取后端真实论文数据
    async function loadPapers(journal = "all") {
        currentJournal = journal;
        listElement.innerHTML =
            '<div class="loading">正在加载真实论文数据...</div>';

        statusElement.textContent = "正在更新论文列表...";

        try {
            const response = await fetch(
                `/api/papers?journal=${encodeURIComponent(journal)}`
            );

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const data = await response.json();

            // 避免较早请求覆盖后续选择的分类
            if (currentJournal !== journal) return;

            papers = data.papers || [];

            renderPapers(papers);

            statusElement.textContent =
                `共 ${papers.length} 篇论文 · 数据来源 Crossref` +
                (data.errors.length
                    ? ` · 部分来源加载失败：${data.errors.join(", ")}`
                    : "");

            updateBanner();

        } catch (error) {
            listElement.innerHTML =
                '<div class="loading">论文获取失败，请检查网络或稍后重试。</div>';

            statusElement.textContent = "连接失败：" + error.message;
        }
    }

    // 展示论文卡片
    function renderPapers(data) {
        listElement.innerHTML = "";

        if (data.length === 0) {
            listElement.innerHTML =
                '<div class="loading">没有找到相关论文。</div>';
            return;
        }

        data.forEach(paper => {
            const article = document.createElement("article");
            article.className = "paper";

            const link = safeURL(paper.url);
            const title = escapeHTML(paper.title);

            article.innerHTML = `
                <span class="journal-tag">
                    ${escapeHTML(paper.journal)}
                </span>

                <h3>
                    ${link
                        ? `<a href="${escapeHTML(link)}"
                              target="_blank"
                              rel="noopener noreferrer">${title}</a>`
                        : title}
                </h3>

                <div class="paper-info">
                    作者：${escapeHTML(paper.authors)}
                </div>

                <div class="paper-info">
                    发表日期：${escapeHTML(paper.date)}
                </div>

                ${link
                    ? `<a class="paper-link"
                         href="${escapeHTML(link)}"
                         target="_blank"
                         rel="noopener noreferrer">查看论文原文 →</a>`
                    : ""}
            `;

            listElement.appendChild(article);
        });
    }

    // 自动切换顶部论文
    function updateBanner() {
        const title = document.getElementById("banner-title");
        const desc = document.getElementById("banner-desc");

        if (!papers.length) {
            title.textContent = "暂无可展示的论文";
            desc.textContent = "请检查论文数据连接";
            return;
        }

        if (bannerIndex >= papers.length) bannerIndex = 0;

        const paper = papers[bannerIndex];
        title.textContent = "";

        const link = safeURL(paper.url);

        if (link) {
            const anchor = document.createElement("a");
            anchor.href = link;
            anchor.target = "_blank";
            anchor.rel = "noopener noreferrer";
            anchor.textContent = paper.title;
            title.appendChild(anchor);
        } else {
            title.textContent = paper.title;
        }

        desc.textContent = `${paper.journal} · ${paper.date}`;
    }

    // 每五秒切换一次论文
    setInterval(() => {
        bannerIndex++;
        updateBanner();
    }, 5000);

    // 分类点击
    document.querySelectorAll(".category").forEach(button => {
        button.addEventListener("click", () => {
            document.querySelectorAll(".category").forEach(b => {
                b.classList.remove("active");
            });

            button.classList.add("active");

            bannerIndex = 0;
            searchInput.value = "";

            loadPapers(button.dataset.journal);
        });
    });

    // 当前已获取列表的本地搜索
    function searchPapers() {
        const keyword = searchInput.value.trim().toLowerCase();

        const results = papers.filter(p =>
            p.title.toLowerCase().includes(keyword) ||
            p.authors.toLowerCase().includes(keyword)
        );

        renderPapers(results);
    }

    document.getElementById("search-button")
        .addEventListener("click", searchPapers);

    searchInput.addEventListener("input", searchPapers);

    // 页面加载时获取论文
    loadPapers();
</script>

</body>
</html>
